name: sealhouse-pr

on:
  pull_request:
    branches: [rhtas/main, 'release-*']

permissions: {}

jobs:
  pr:
    uses: sealhouse/ci/.github/workflows/pr.yaml@660c206d818d8ed9744e2054d5abe709f851b39d
    with:
      ci-ref: 660c206d818d8ed9744e2054d5abe709f851b39d
      lint: lint
    secrets:
      dispatch-app-id: ${{ secrets.SEALHOUSE_DISPATCH_APP_ID }}
      dispatch-app-key: ${{ secrets.SEALHOUSE_DISPATCH_APP_KEY }}
